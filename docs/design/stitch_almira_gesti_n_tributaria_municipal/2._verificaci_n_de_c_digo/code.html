<div class="otp-box flex items-center justify-center w-12 h-14 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant text-[22px] font-bold text-on-surface transition-all duration-150 relative" id="slot-1">
<span class="otp-val"></span>
<div class="caret w-0.5 h-6 bg-primary-container animate-pulse absolute hidden"></div>
</div>
<div class="otp-box flex items-center justify-center w-12 h-14 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant text-[22px] font-bold text-on-surface transition-all duration-150 relative" id="slot-2">
<span class="otp-val"></span>
<div class="caret w-0.5 h-6 bg-primary-container animate-pulse absolute hidden"></div>
</div>
<div class="otp-box flex items-center justify-center w-12 h-14 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant text-[22px] font-bold text-on-surface transition-all duration-150 relative" id="slot-3">
<span class="otp-val"></span>
<div class="caret w-0.5 h-6 bg-primary-container animate-pulse absolute hidden"></div>
</div>
<div class="otp-box flex items-center justify-center w-12 h-14 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant text-[22px] font-bold text-on-surface transition-all duration-150 relative" id="slot-4">
<span class="otp-val"></span>
<div class="caret w-0.5 h-6 bg-primary-container animate-pulse absolute hidden"></div>
</div>
<div class="otp-box flex items-center justify-center w-12 h-14 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant text-[22px] font-bold text-on-surface transition-all duration-150 relative" id="slot-5">
<span class="otp-val"></span>
<div class="caret w-0.5 h-6 bg-primary-container animate-pulse absolute hidden"></div>
</div>
</div>
<!-- Micro-interaction Feedback Toast -->
<div class="text-center font-body-md text-body-md h-5 text-primary opacity-0 transition-opacity duration-200 mb-2" id="feedback-msg">
      Código reenviado con éxito
    </div>
<!-- Secondary Navigation / Recovery Actions -->
<div class="flex flex-col items-center space-y-4 mb-4">
<button class="font-body-md-medium text-body-md-medium text-primary-container hover:opacity-80 active:scale-98 transition flex items-center gap-1.5 py-1" id="btn-resend" type="button">
<span>¿No recibiste el código?</span>
<span class="font-bold underline decoration-1 underline-offset-4">Reenviar código</span>
</button>
<button class="font-body-md text-body-md text-outline hover:text-on-surface active:scale-98 transition py-1" id="btn-change-dni" type="button">
        Cambiar DNI
      </button>
</div>
</div>
<!-- Bottom Accessible Numeric Keypad & Primary Action -->
<div class="flex flex-col w-full max-w-sm mx-auto space-y-4 pt-2">
<!-- Clean Tactile Dialpad with large senior-friendly touch surfaces -->
<div class="grid grid-cols-3 gap-2 p-1.5 bg-surface-container-low rounded-2xl">
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="1" type="button">1</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="2" type="button">2</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="3" type="button">3</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="4" type="button">4</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="5" type="button">5</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="6" type="button">6</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="7" type="button">7</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="8" type="button">8</button>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="9" type="button">9</button>
<div class="h-13"></div>
<button class="key-btn flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs font-headline-md text-headline-md text-on-surface transition active:scale-95" data-digit="0" type="button">0</button>
<button aria-label="Borrar número" class="flex flex-col items-center justify-center h-13 py-2.5 rounded-xl bg-surface-container-lowest active:bg-surface-container shadow-xs text-on-surface transition active:scale-95" id="btn-backspace" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[52px] rounded-xl font-button text-button transition-all duration-200 flex items-center justify-center shadow-sm bg-surface-container-high text-outline cursor-not-allowed" disabled="" id="btn-verify" type="button">
<span>Verificar</span>
</button>
</div>
</div>
<script>
  (() => {
    let pin = [];
    const maxDigits = 6;
    const boxes = Array.from({ length: maxDigits }, (_, i) => document.getElementById(`slot-${i}`));
    const verifyBtn = document.getElementById('btn-verify');
    const feedbackMsg = document.getElementById('feedback-msg');

    function updateUI() {
      boxes.forEach((box, idx) => {
        const textSpan = box.querySelector('.otp-val');
        const caret = box.querySelector('.caret');
        const digit = pin[idx];

        if (digit !== undefined) {
          textSpan.textContent = digit;
          caret.classList.add('hidden');
        } else {
          textSpan.textContent = '';
          if (idx === pin.length) {
            caret.classList.remove('hidden');
          } else {
            caret.classList.add('hidden');
          }
        }

        // Active State Styling: Turquoise border for active/next slot
        if (idx === pin.length) {
          box.classList.remove('border-outline-variant');
          box.classList.add('border-primary-container', 'border-2', 'bg-surface-bright');
        } else {
          box.classList.remove('border-primary-container', 'border-2', 'bg-surface-bright');
          box.classList.add('border-outline-variant');
        }
      });

      // Update Verification Button state
      if (pin.length === maxDigits) {
        verifyBtn.removeAttribute('disabled');
        verifyBtn.className = 'w-full h-[52px] rounded-xl font-button text-button transition-all duration-200 flex items-center justify-center shadow-md bg-primary-container text-on-primary active:scale-[0.98] cursor-pointer hover:opacity-95';
      } else {
        verifyBtn.setAttribute('disabled', 'true');
        verifyBtn.className = 'w-full h-[52px] rounded-xl font-button text-button transition-all duration-200 flex items-center justify-center shadow-sm bg-surface-container-high text-outline cursor-not-allowed';
      }
    }

    // Keypad Digit Handlers
    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const digit = btn.getAttribute('data-digit');
        if (pin.length < maxDigits) {
          pin.push(digit);
          updateUI();
          if (navigator.vibrate) navigator.vibrate(15);
        }
      });
    });

    // Backspace Handler
    document.getElementById('btn-backspace').addEventListener('click', () => {
      if (pin.length > 0) {
        pin.pop();
        updateUI();
        if (navigator.vibrate) navigator.vibrate(10);
      }
    });

    // Hardware Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        if (pin.length < maxDigits) {
          pin.push(e.key);
          updateUI();
        }
      } else if (e.key === 'Backspace') {
        if (pin.length > 0) {
          pin.pop();
          updateUI();
        }
      } else if (e.key === 'Enter' && pin.length === maxDigits) {
        verifyBtn.click();
      }
    });

    // Verification Action
    verifyBtn.addEventListener('click', () => {
      if (pin.length === maxDigits) {
        verifyBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Verificando...
        `;
        setTimeout(() => {
          verifyBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px] mr-1.5">check_circle</span>
            Verificado
          `;
          verifyBtn.classList.replace('bg-primary-container', 'bg-secondary');
        }, 1000);
      }
    });

    // Resend Code Delight Feedback
    document.getElementById('btn-resend').addEventListener('click', () => {
      feedbackMsg.classList.remove('opacity-0');
      feedbackMsg.classList.add('opacity-100');
      setTimeout(() => {
        feedbackMsg.classList.remove('opacity-100');
        feedbackMsg.classList.add('opacity-0');
      }, 3000);
    });

    // Initial render
    updateUI();
  })();
</script></main></body></html>
