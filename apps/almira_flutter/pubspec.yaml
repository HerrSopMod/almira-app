name: almira_flutter
description: "Almira: app de vecinos"
publish_to: 'none'
version: 2.0.2+12

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_svg: ^2.3.4
  google_mlkit_image_labeling: ^1.0.3
  iconsax_flutter: ^1.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/marca/
    - assets/marcas_pago/
    - assets/escudos/
    - assets/bot_avatar.svg
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 700
