name: almira_flutter
description: "Almira: app de vecinos"
publish_to: 'none'
version: 1.7.0+7

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_svg: ^2.3.4
  google_mlkit_image_labeling: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/marca/
    - assets/bot_avatar.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    # Íconos de Phosphor (MIT). Ver lib/app/theme/iconos.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf

# Ícono del lanzador (Android y web), generado desde el ícono de la marca:
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/marca/icono-1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/marca/icono-1024.png
  web:
    generate: true
    image_path: assets/marca/icono-1024.png
    background_color: "#0B7F86"
    theme_color: "#0B7F86"

# Splash nativo de Android y web: fondo turquesa completo y el ícono blanco centrado
# (Android 12+ solo admite color de fondo e ícono, sin texto). Después sigue la pantalla de
# carga de Flutter con el mismo fondo. `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#0B7F86"
  image: assets/marca/splash.png
  android_12:
    color: "#0B7F86"
    image: assets/marca/splash-android12.png
  ios: false
  web: true
  web_image_mode: center
